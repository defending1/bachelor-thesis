[project]
name = "experiments"
version = "0.1.0"
description = "Unified tensor decomposition & application experiments (DS-CDMA, EEM Spectroscopy, Typical Rank)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tensorly>=0.8.1",
    "matplotlib>=3.7.0",
    "scienceplots>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dscdma-generator = "experiments.dscdma.cli:run_generator_cli"
dscdma-plot = "experiments.dscdma.cli:run_plot_cli"
eem-experiment = "experiments.tensor_data_eem.eem_cp_experiment:main"
typical-rank-experiment = "experiments.typical_rank.typical_rank_experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["experiments"]
