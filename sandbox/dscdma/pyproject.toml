[project]
name = "dscdma"
version = "0.1.0"
description = "DS-CDMA 3D Tensor Synthesis and CP-ALS Factor Recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tensorly>=0.8.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dscdma-generator = "dscdma.cli:run_generator_cli"
dscdma-solver = "dscdma.cli:run_solver_cli"
dscdma-plot = "dscdma.cli:run_plot_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dscdma"]
